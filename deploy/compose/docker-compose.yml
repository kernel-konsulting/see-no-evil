# =============================================================================
# see-no-evil — Docker Compose
# =============================================================================
#
# Profiles:
#   core              api + ui + dns + proxy + classifiers + updater (default)
#   scanner           + the optional nmap-based device scanner
#   gpu               classifiers swapped for CUDA-enabled images
#   redis             swap embedded cache for Redis
#   postgres          swap SQLite for Postgres
#   observability     Vector + VictoriaMetrics + Grafana
#   vpn-tailscale     Tailscale sidecar
#   vpn-wg            wg-easy
#   backup            sidecar that runs `seenoevil-backup snapshot` on a cron
#   litestream        sidecar that streams /data/policy.db to an S3-compatible target
#
# Usage:
#   # First-run only — configure admin account:
#   docker compose --profile setup run --rm sne-setup
#
#   # Start the full stack:
#   docker compose --profile core up -d
#
#   # Optional profiles:
#   docker compose --profile core --profile postgres --profile redis up -d
# =============================================================================

name: seenoevil

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Public-facing: DNS, proxy, UI ingress.
  edge:
    driver: bridge

  # Internal-only: classifiers, API, policy. NO egress to the internet.
  # `internal: true` is the Compose equivalent of "default-deny egress".
  internal:
    driver: bridge
    internal: true

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  data:        # /data — DB, CA, models, lists, audit, backups
  caddy_data:  # Caddy's internal CA + ACME state
  caddy_config:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------------
  # setup profile — first-run wizard (run once, not kept up)
  # -------------------------------------------------------------------------
  sne-setup:
    profiles: [setup]
    build: ../../services/api
    image: ghcr.io/kernel-konsulting/seenoevil-api:dev
    networks: [internal]
    volumes:
      - data:/data
    environment:
      SEENOEVIL_DATA_DIR: /data
      # Pre-set these to skip interactive prompts in automated installs:
      # SEENOEVIL_INITIAL_ADMIN_EMAIL: admin@example.local
      # SEENOEVIL_INITIAL_ADMIN_PASSWORD: changeme
      # SNE_HOSTNAME: seenoevil.lan
    entrypoint: ["seenoevil-setup"]

  # -------------------------------------------------------------------------
  # core profile
  # -------------------------------------------------------------------------
  api:
    profiles: [core]
    build: ../../services/api
    image: ghcr.io/kernel-konsulting/seenoevil-api:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data
      - ../../config.example.yaml:/etc/seenoevil/config.yaml:ro
    environment:
      SEENOEVIL_CONFIG: /etc/seenoevil/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ui:
    profiles: [core]
    build: ../../services/ui
    image: ghcr.io/kernel-konsulting/seenoevil-ui:dev
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    profiles: [core]
    build: ../../services/caddy
    image: ghcr.io/kernel-konsulting/seenoevil-caddy:dev
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SNE_HOSTNAME: "${SNE_HOSTNAME:-seenoevil.lan}"
      SNE_TLS_MODE: "${SNE_TLS_MODE:-internal}"
      SNE_TLS_EMAIL: "${SNE_TLS_EMAIL:-}"
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  dns:
    profiles: [core]
    build: ../../services/dns
    image: ghcr.io/kernel-konsulting/seenoevil-dns:dev
    restart: unless-stopped
    # DNS lives on the edge: clients must be able to reach it.
    networks: [edge]
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/blocking/status"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    profiles: [core]
    build: ../../services/proxy
    image: ghcr.io/kernel-konsulting/seenoevil-proxy:dev
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - data:/data
    depends_on:
      api:
        condition: service_healthy
      image-classifier:
        condition: service_started
      text-classifier:
        condition: service_started
      video-sampler:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  image-classifier:
    profiles: [core]
    build: ../../services/image-classifier
    image: ghcr.io/kernel-konsulting/seenoevil-image-classifier:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data

  text-classifier:
    profiles: [core]
    build: ../../services/text-classifier
    image: ghcr.io/kernel-konsulting/seenoevil-text-classifier:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data

  video-sampler:
    profiles: [core]
    build: ../../services/video-sampler
    image: ghcr.io/kernel-konsulting/seenoevil-video-sampler:dev
    restart: unless-stopped
    networks: [internal]
    depends_on: [image-classifier]

  # The updater is the ONLY container with unrestricted egress.
  updater:
    profiles: [core]
    build: ../../services/updater
    image: ghcr.io/kernel-konsulting/seenoevil-updater:dev
    restart: unless-stopped
    networks: [edge]
    volumes:
      - data:/data

  # -------------------------------------------------------------------------
  # scanner profile (optional)
  # -------------------------------------------------------------------------
  scanner:
    profiles: [scanner]
    build: ../../services/scanner
    image: ghcr.io/kernel-konsulting/seenoevil-scanner:dev
    restart: unless-stopped
    # Needs to see the LAN to scan it. Host networking is the simplest route;
    # alternatively use a macvlan network + CAP_NET_RAW + CAP_NET_ADMIN.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - data:/data
      - ../../config.example.yaml:/etc/seenoevil/config.yaml:ro
    environment:
      SEENOEVIL_CONFIG: /etc/seenoevil/config.yaml
      API_BASE: "http://api:8000"
      API_TOKEN: "${SCANNER_API_TOKEN:-}"
      LOG_LEVEL: "${SCANNER_LOG_LEVEL:-INFO}"
      METRICS_PORT: "9102"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/scanner_ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # -------------------------------------------------------------------------
  # postgres profile (optional, replaces SQLite)
  # -------------------------------------------------------------------------
  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: seenoevil
      POSTGRES_USER: seenoevil
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password

  # -------------------------------------------------------------------------
  # redis profile (optional, replaces embedded cache)
  # -------------------------------------------------------------------------
  redis:
    profiles: [redis]
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------------------
  # vpn-tailscale profile (optional)
  # -------------------------------------------------------------------------
  tailscale:
    profiles: [vpn-tailscale]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - data:/var/lib/tailscale
    environment:
      TS_HOSTNAME: seenoevil
      TS_AUTHKEY_FILE: /run/secrets/tailscale_authkey
    secrets:
      - tailscale_authkey

  # -------------------------------------------------------------------------
  # vpn-wg profile (optional)
  # -------------------------------------------------------------------------
  wg-easy:
    profiles: [vpn-wg]
    image: ghcr.io/wg-easy/wg-easy
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"   # web UI
    volumes:
      - data:/etc/wireguard

  # -------------------------------------------------------------------------
  # backup profile (optional) — periodic local snapshots of the policy DB + CA.
  # Use this when you want point-in-time tarballs you can copy off-box.
  # For continuous replication, use the `litestream` profile instead.
  # -------------------------------------------------------------------------
  backup:
    profiles: [backup]
    build: ../../services/api
    image: ghcr.io/kernel-konsulting/seenoevil-api:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data
      - ../../config.example.yaml:/etc/seenoevil/config.yaml:ro
    environment:
      SEENOEVIL_CONFIG: /etc/seenoevil/config.yaml
      SNE_BACKUP_INTERVAL_SECONDS: "${SNE_BACKUP_INTERVAL_SECONDS:-86400}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          seenoevil-backup snapshot || echo "snapshot failed (continuing)"
          sleep "$$SNE_BACKUP_INTERVAL_SECONDS"
        done

  # -------------------------------------------------------------------------
  # litestream profile (optional) — continuous replication of /data/policy.db
  # to an S3-compatible target. See docs/backup.md.
  # -------------------------------------------------------------------------
  litestream:
    profiles: [litestream]
    image: litestream/litestream:0.3
    restart: unless-stopped
    networks: [edge]
    volumes:
      - data:/data
      - ../../services/api/litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:-}"
      LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:-}"
    command: ["replicate", "-config", "/etc/litestream.yml"]

  # -------------------------------------------------------------------------
  # observability profile (optional)
  # -------------------------------------------------------------------------
  vector:
    profiles: [observability]
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    networks: [internal, edge]
    volumes:
      - data:/data
      - ../../services/observability/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      - victoriametrics

  victoriametrics:
    profiles: [observability]
    image: victoriametrics/victoria-metrics:stable
    restart: unless-stopped
    networks: [internal]
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
    volumes:
      - data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - data:/var/lib/grafana
      - ../../services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      victoriametrics:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Secrets (file-based; create them under deploy/compose/secrets/)
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  tailscale_authkey:
    file: ./secrets/tailscale_authkey.txt
