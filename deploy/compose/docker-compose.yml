# =============================================================================
# see-no-evil — Docker Compose
# =============================================================================
#
# Profiles:
#   core              api + ui + dns + proxy + classifiers + updater (default)
#   scanner           + the optional nmap-based device scanner
#   gpu               classifiers swapped for CUDA-enabled images
#   redis             swap embedded cache for Redis
#   postgres          swap SQLite for Postgres
#   observability     Vector + VictoriaMetrics + Grafana
#   vpn-tailscale     Tailscale sidecar
#   vpn-wg            wg-easy
#   backup            sidecar that runs `seenoevil-backup snapshot` on a cron
#   litestream        sidecar that streams /data/policy.db to an S3-compatible target
#
# Usage:
#   # First-run only — configure admin account:
#   docker compose --profile setup run --rm sne-setup
#
#   # Start the full stack:
#   docker compose --profile core up -d
#
#   # Optional profiles:
#   docker compose --profile core --profile postgres --profile redis up -d
# =============================================================================

name: seenoevil

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  # Public-facing: DNS, proxy, UI ingress.
  edge:
    driver: bridge

  # Internal-only: classifiers, API, policy. NO egress to the internet.
  # `internal: true` is the Compose equivalent of "default-deny egress".
  internal:
    driver: bridge
    internal: true

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  data:        # /data — DB, models, audit, backups (root-owned, used by api/updater)
  proxy_data:  # /data — MITM CA + per-host leaf cert cache (nonroot owned)
  dns_data:    # /data — Blocky lists (blocky uid 100 owned)
  caddy_data:  # Caddy's internal CA + ACME state
  caddy_config:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # -------------------------------------------------------------------------
  # setup profile — first-run wizard (run once, not kept up)
  # -------------------------------------------------------------------------
  sne-setup:
    profiles: [setup]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-api:dev
    networks: [internal]
    volumes:
      - data:/data
    environment:
      SEENOEVIL_DATA_DIR: /data
      # Pre-set these to skip interactive prompts in automated installs:
      # SEENOEVIL_INITIAL_ADMIN_EMAIL: admin@example.local
      # IMPORTANT: Change SEENOEVIL_INITIAL_ADMIN_PASSWORD from the default!
      # Generate with: openssl rand -base64 24
      SEENOEVIL_INITIAL_ADMIN_PASSWORD: "${SEENOEVIL_INITIAL_ADMIN_PASSWORD:-}"
      # SNE_HOSTNAME: seenoevil.lan
    entrypoint: ["seenoevil-setup"]

  # -------------------------------------------------------------------------
  # core profile
  # -------------------------------------------------------------------------
  api:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-api:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data
      - ../../config.example.yaml:/etc/seenoevil/config.example.yaml:ro
    environment:
      SEENOEVIL_CONFIG: /data/config.yaml
      # Shared secrets for in-pod callers (proxy → decide/runtime/heartbeat,
      # scanner → devices/discover). Must match the proxy/scanner containers.
      SEENOEVIL_PROXY_TOKEN: "${SEENOEVIL_PROXY_TOKEN:-}"
      SCANNER_API_TOKEN: "${SCANNER_API_TOKEN:-}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ui:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/ui/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-ui:dev
    restart: unless-stopped
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/caddy/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-caddy:dev
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      # Rootless Podman cannot bind privileged ports; defaults move them
      # to the unprivileged range.  Set SNE_HTTP_PORT=80 / SNE_HTTPS_PORT=443
      # when running as root or with capability NET_BIND_SERVICE.
      - "${SNE_HTTP_PORT:-8088}:80"
      - "${SNE_HTTPS_PORT:-8448}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SNE_HOSTNAME: "${SNE_HOSTNAME:-seenoevil.lan}"
      SNE_TLS_MODE: "${SNE_TLS_MODE:-internal}"
      SNE_TLS_EMAIL: "${SNE_TLS_EMAIL:-}"
    depends_on:
      ui:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  dns:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/dns/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-dns:dev
    restart: unless-stopped
    # DNS lives on the edge: clients must be able to reach it.
    networks: [edge]
    ports:
      # Rootless Podman cannot bind privileged ports; override to 53 if needed.
      - "${SNE_DNS_PORT_UDP:-1053}:53/udp"
      - "${SNE_DNS_PORT_TCP:-1053}:53/tcp"
    volumes:
      - dns_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/blocking/status"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/proxy/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-proxy:dev
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - proxy_data:/data
      - data:/data:ro
      - ../../config.example.yaml:/etc/seenoevil/config.example.yaml:ro
    environment:
      CONFIG_PATH: /data/config.yaml
      # Must match the api container's SEENOEVIL_PROXY_TOKEN.
      SEENOEVIL_PROXY_TOKEN: "${SEENOEVIL_PROXY_TOKEN:-}"
    depends_on:
      api:
        condition: service_healthy
      image-classifier:
        condition: service_started
      text-classifier:
        condition: service_started
      video-sampler:
        condition: service_started
    healthcheck:
      test: ["CMD", "/proxy", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  image-classifier:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/image-classifier/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-image-classifier:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data

  text-classifier:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/text-classifier/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-text-classifier:dev
    restart: unless-stopped
    networks: [internal]
    volumes:
      - data:/data

  video-sampler:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/video-sampler/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-video-sampler:dev
    restart: unless-stopped
    networks: [internal]
    depends_on: [image-classifier]

  # The updater is the ONLY container with unrestricted egress.
  updater:
    profiles: [core]
    build:
      context: ../..
      dockerfile: services/updater/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-updater:dev
    restart: unless-stopped
    networks: [edge]
    volumes:
      - data:/data

  # -------------------------------------------------------------------------
  # scanner profile (optional)
  # -------------------------------------------------------------------------
  scanner:
    profiles: [scanner]
    build:
      context: ../..
      dockerfile: services/scanner/Dockerfile
    image: ghcr.io/kernel-konsulting/seenoevil-scanner:dev
    restart: unless-stopped
    # Needs to see the LAN to scan it. Host networking is the simplest route;
    # alternatively use a macvlan network + CAP_NET_RAW + CAP_NET_ADMIN.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - data:/data
      - ../../config.example.yaml:/etc/seenoevil/config.example.yaml:ro
    environment:
      SEENOEVIL_CONFIG: /data/config.yaml
      # Host networking: `api` DNS won't resolve, so override via API_BASE_HOST.
      API_BASE: "http://127.0.0.1:8000"
      API_TOKEN: "${SCANNER_API_TOKEN:-}"
      SCANNER_HOST_NETWORK: "1"
      LOG_LEVEL: "${SCANNER_LOG_LEVEL:-INFO}"
      METRICS_PORT: "9102"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/scanner_ready"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # -------------------------------------------------------------------------
  # postgres profile (optional, replaces SQLite)
  # -------------------------------------------------------------------------
  postgres:
    profiles: [postgres]
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: seenoevil
      POSTGRES_USER: seenoevil
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password

  # -------------------------------------------------------------------------
  # redis profile (optional, replaces embedded cache)
  # -------------------------------------------------------------------------
  redis:
    profiles: [redis]
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data

  # -------------------------------------------------------------------------
  # vpn-tailscale profile (optional)
  # -------------------------------------------------------------------------
  tailscale:
    profiles: [vpn-tailscale]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - data:/var/lib/tailscale
    environment:
      TS_HOSTNAME: seenoevil
      TS_AUTHKEY_FILE: /run/secrets/tailscale_authkey
    secrets:
      - tailscale_authkey

  # -------------------------------------------------------------------------
  # vpn-wg profile (optional)
  # -------------------------------------------------------------------------
  # wg-easy:
  #   profiles: [vpn-wg]
  #   image: ghcr.io/wg-easy/wg-easy
  #   restart: unless-stopped
  #   cap_add:
  #     - NET_ADMIN
  #     - SYS_MODULE
  #   sysctls:
  #     - net.ipv4.ip_forward=1
  #     - net.ipv4.conf.all.src_valid_mark=1
  #   ports:
  #     - "51820:51820/udp"
  #     - "51821:51821/tcp"   # web UI
  #   volumes:
  #     - data:/etc/wireguard

  # -------------------------------------------------------------------------
  # backup profile (optional) — periodic local snapshots of the policy DB + CA.
  # Use this when you want point-in-time tarballs you can copy off-box.
  # For continuous replication, use the `litestream` profile instead.
  # -------------------------------------------------------------------------
  # backup:
  #   profiles: [backup]
  #   build: ../../services/api
  #   image: ghcr.io/kernel-konsulting/seenoevil-api:dev
  #   restart: unless-stopped
  #   networks: [internal]
  #   volumes:
  #     - data:/data
  #     - ../../config.example.yaml:/etc/seenoevil/config.yaml:ro
  #   environment:
  #     SEENOEVIL_CONFIG: /etc/seenoevil/config.yaml
  #     SNE_BACKUP_INTERVAL_SECONDS: "${SNE_BACKUP_INTERVAL_SECONDS:-86400}"
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       set -eu
  #       while true; do
  #         seenoevil-backup snapshot || echo "snapshot failed (continuing)"
  #         sleep "$$SNE_BACKUP_INTERVAL_SECONDS"
  #       done

  # -------------------------------------------------------------------------
  # litestream profile (optional) — continuous replication of /data/policy.db
  # to an S3-compatible target. See docs/backup.md.
  # -------------------------------------------------------------------------
  # litestream:
  #   profiles: [litestream]
  #   image: litestream/litestream:0.3
  #   restart: unless-stopped
  #   networks: [edge]
  #   volumes:
  #     - data:/data
  #     - ../../services/api/litestream.yml:/etc/litestream.yml:ro
  #   environment:
  #     LITESTREAM_ACCESS_KEY_ID: "${LITESTREAM_ACCESS_KEY_ID:-}"
  #     LITESTREAM_SECRET_ACCESS_KEY: "${LITESTREAM_SECRET_ACCESS_KEY:-}"
  #   command: ["replicate", "-config", "/etc/litestream.yml"]

  # -------------------------------------------------------------------------
  # observability profile (optional)
  # -------------------------------------------------------------------------
  vector:
    profiles: [observability]
    image: timberio/vector:latest-alpine
    restart: unless-stopped
    networks: [internal, edge]
    volumes:
      - data:/data
      - ../../services/observability/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.toml"]
    depends_on:
      - victoriametrics

  victoriametrics:
    profiles: [observability]
    image: victoriametrics/victoria-metrics:stable
    restart: unless-stopped
    networks: [internal]
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--retentionPeriod=${VM_RETENTION_PERIOD:-30d}"
    volumes:
      - data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8428/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  grafana:
    profiles: [observability]
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    networks: [internal, edge]
    ports:
      # Localhost-only by default: Grafana ships with admin/changeme until
      # GRAFANA_ADMIN_PASSWORD is set, so do not expose it on the LAN.
      # Override with e.g. SNE_GRAFANA_BIND=0.0.0.0 once a real password is set.
      - "${SNE_GRAFANA_BIND:-127.0.0.1}:${SNE_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-changeme}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - data:/var/lib/grafana
      - ../../services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      victoriametrics:
        condition: service_healthy

  vmalert:
    profiles: [observability]
    image: victoriametrics/vmalert:stable
    restart: unless-stopped
    networks: [internal]
    command:
      - "--datasource.url=http://victoriametrics:8428"
      - "--remoteWrite.url=http://victoriametrics:8428"
      - "--notifier.url=http://api:8000/v1/alerts/webhook"
      - "--rule=/etc/vmalert/alerts.yml"
      - "--evaluationInterval=30s"
    volumes:
      - ../../services/observability/alerts.yml:/etc/vmalert/alerts.yml:ro
    depends_on:
      victoriametrics:
        condition: service_healthy

  cadvisor:
    profiles: [observability]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    networks: [internal]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# ---------------------------------------------------------------------------
# Secrets (file-based; create them under deploy/compose/secrets/)
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  tailscale_authkey:
    file: ./secrets/tailscale_authkey.txt
