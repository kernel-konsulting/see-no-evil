server {
    listen       8081;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Health endpoint for Docker healthcheck + Caddy upstream checks.
    location /healthz {
        access_log  off;
        return 200 "ok\n";
        add_header  Content-Type text/plain;
    }

    # SPA fallback — all unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the HTML shell (JS/CSS are content-hashed by Vite).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires    0;
    }

    # Long-lived cache for hashed assets.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires    1y;
    }
}
