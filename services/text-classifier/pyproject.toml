[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seenoevil-text-classifier"
version = "0.1.0"
description = "see-no-evil text classification gRPC service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "kernel-konsulting" }]

dependencies = [
  "grpcio==1.67.1",
  "grpcio-health-checking==1.67.1",
  "grpcio-reflection==1.67.1",
  "protobuf==5.29.2",
  "onnxruntime==1.20.1",
  "numpy==2.1.3",
  # tokenizer — using the fast HF tokenizer wheel (CPU only, no torch)
  "tokenizers==0.21.0",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[project.scripts]
seenoevil-text-classifier = "seenoevil_text_classifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
