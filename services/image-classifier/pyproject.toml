[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seenoevil-image-classifier"
version = "0.1.0"
description = "see-no-evil image classification gRPC service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "kernel-konsulting" }]

dependencies = [
  # gRPC
  "grpcio==1.67.1",
  "grpcio-health-checking==1.67.1",
  "grpcio-reflection==1.67.1",
  "protobuf==5.29.2",
  # inference
  "onnxruntime==1.20.1",
  "Pillow==11.0.0",
  "pillow-avif-plugin==1.5.2",
  "CairoSVG==2.7.1",
  "defusedxml==0.7.1",
  "numpy==2.1.3",
  # observability
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
gpu = [
  "onnxruntime-gpu==1.20.1",
]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[project.scripts]
seenoevil-image-classifier = "seenoevil_image_classifier.__main__:main"
seenoevil-image-regression = "seenoevil_image_classifier.regression:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
