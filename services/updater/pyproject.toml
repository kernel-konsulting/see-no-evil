[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seenoevil-updater"
version = "0.1.0"
description = "see-no-evil model weight and blocklist updater"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "kernel-konsulting" }]

dependencies = [
  "httpx==0.28.1",
  "pyyaml==6.0.2",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "respx==0.22.0",
]

[project.scripts]
seenoevil-updater = "seenoevil_updater.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
