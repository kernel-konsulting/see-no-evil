[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seenoevil-api"
version = "0.1.0"
description = "see-no-evil control-plane API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "kernel-konsulting" }]

dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "pyyaml==6.0.2",
  "prometheus-client==0.21.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
]

[project.scripts]
seenoevil-api = "seenoevil_api.__main__:main"
seenoevil-setup = "seenoevil_api.wizard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seenoevil_api = ["alembic.ini", "alembic/*", "alembic/versions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
]
