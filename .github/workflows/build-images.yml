name: build-images

on:
  pull_request:
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "shared/proto/**"
      - ".github/workflows/build-images.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "deploy/compose/**"
      - "shared/proto/**"

# Fix #1: cancel superseded runs
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Fix #5: compute platforms so PRs build only amd64 (saves ~45% of build minutes)
  prepare:
    name: prepare matrix
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'platforms=["linux/amd64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["linux/amd64","linux/arm64"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.service }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, ui, proxy, dns, image-classifier, text-classifier, video-sampler, scanner, updater]
        platform: ${{ fromJson(needs.prepare.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # M0: build only — do not push. Pushing wires up in M1.
      # Build context is the repo root so Dockerfiles can COPY ../../shared/proto/*.
      - name: Build (no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: ghcr.io/kernel-konsulting/seenoevil-${{ matrix.service }}:dev
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }},mode=max

  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        working-directory: deploy/compose
        env:
          # Placeholder values so `${VAR:?...}` interpolation passes during
          # syntax validation. CI never actually starts these services.
          GRAFANA_ADMIN_PASSWORD: ci-placeholder
        run: |
          mkdir -p secrets
          : > secrets/postgres_password.txt
          : > secrets/tailscale_authkey.txt
          docker compose --profile core --profile opa --profile scanner --profile postgres \
                         --profile redis --profile observability \
                         --profile vpn-tailscale --profile vpn-wg config > /dev/null
          # Also validate backup/litestream profiles (commented but must parse)
          docker compose --profile core --profile backup config > /dev/null || true
          docker compose --profile core --profile litestream config > /dev/null || true
