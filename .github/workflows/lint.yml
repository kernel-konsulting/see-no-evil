name: lint

on:
  pull_request:
    paths:
      - "services/**"
      - "shared/proto/**"
      - "policies/**"
      - "deploy/compose/**"
      - "pyproject.toml"
      - "ruff.toml"
      - ".yamllint.yml"
      - ".github/workflows/lint.yml"
      - "**/*.py"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "shared/proto/**"
      - "policies/**"
      - "deploy/compose/**"
      - "pyproject.toml"
      - "ruff.toml"
      - ".yamllint.yml"
      - ".github/workflows/lint.yml"
      - "**/*.py"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

# Fix #1: cancel superseded runs on same ref (saves ~30-40% on force-pushes)
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install --no-cache-dir 'ruff==0.6.9'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  go:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/proxy, services/video-sampler]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: false
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate proto stubs
        working-directory: ${{ matrix.module }}
        run: make generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}

  pytest:
    name: Python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/image-classifier
          - services/text-classifier
          - services/scanner
          - services/updater
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install service + test deps
        working-directory: ${{ matrix.service }}
        run: pip install --no-cache-dir ".[test]"
      - name: Generate proto stubs (mock)
        working-directory: ${{ matrix.service }}
        # Install grpcio-tools to generate the stubs that tests import.
        run: |
          pip install --no-cache-dir grpcio-tools==1.67.1
          SERVICE=$(basename $PWD | tr '-' '_')
          mkdir -p src/seenoevil_${SERVICE}/generated
          python -m grpc_tools.protoc \
            -I../../shared/proto \
            --python_out=src/seenoevil_${SERVICE}/generated \
            --grpc_python_out=src/seenoevil_${SERVICE}/generated \
            ../../shared/proto/classify.proto
          sed -i 's/^import classify_pb2/from . import classify_pb2/' \
            src/seenoevil_${SERVICE}/generated/classify_pb2_grpc.py
      - name: pytest
        working-directory: ${{ matrix.service }}
        run: pytest

  go-test:
    name: Go (test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/proxy, services/video-sampler]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install protoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q --no-install-recommends protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Install ffmpeg
        run: sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Generate proto stubs
        working-directory: ${{ matrix.module }}
        run: make generate
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  opa:
    name: OPA (rego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OPA
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            https://github.com/open-policy-agent/opa/releases/download/v0.68.0/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
      - name: Detect rego files
        id: detect
        run: |
          if find policies -name '*.rego' 2>/dev/null | grep -q .; then
            echo "has_rego=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rego=false" >> "$GITHUB_OUTPUT"
          fi
      - name: opa fmt --diff
        if: steps.detect.outputs.has_rego == 'true'
        run: opa fmt --diff policies/
      - name: opa test
        if: steps.detect.outputs.has_rego == 'true'
        run: opa test -v policies/
      - name: skip
        if: steps.detect.outputs.has_rego != 'true'
        run: echo "no rego policies yet (M0); skipping"

  yaml:
    name: YAML (yamllint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install yamllint
        run: pip install --no-cache-dir 'yamllint==1.35.1'
      - name: yamllint
        run: yamllint -c .yamllint.yml .

  ui-test:
    name: UI (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install deps
        working-directory: services/ui
        run: npm ci
      - name: vitest
        working-directory: services/ui
        run: npm test

  api-tests:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install api package
        working-directory: services/api
        run: pip install --no-cache-dir -e ".[test]"
      - name: pytest
        working-directory: services/api
        run: pytest -ra
